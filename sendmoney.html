<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Digital - Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-custom {
            background-color: #1e3c72;
        }
        .card-custom {
            border-radius: 15px;
            display: none; /* Se oculta inicialmente para aplicar efecto visual de entrada */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-wallet2 me-2"></i>Mi Wallet</span>
            <button id="btnBack" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Menú</button>
        </div>
    </nav>

    <div class="card p-3 mb-4 shadow-sm">
    <h5 class="card-title text-primary">👥 Mi Agenda de Contactos</h5>
    
    <div class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" id="contactName" class="form-control" placeholder="Nombre del contacto">
        </div>
        <div class="col-md-5">
            <input type="email" id="contactEmail" class="form-control" placeholder="Correo (ejemplo@mail.com)">
        </div>
        <div class="col-md-2 d-grid">
            <button type="button" id="btnSaveContact" class="btn btn-success">Guardar</button>
        </div>
    </div>

    <div class="mb-2">
        <label for="contactSelect" class="form-label fw-bold">Seleccionar un contacto guardado:</label>
        <select id="contactSelect" class="form-select">
            <option value="">-- Selecciona para autocompletar --</option>
        </select>
    </div>
</div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-custom bg-white p-4 shadow-sm">
                    
                    <div class="text-center mb-4">
                        <div class="text-success mb-2">
                            <i class="bi bi-arrow-up-right-circle-fill display-4"></i>
                        </div>
                        <h3 class="fw-bold">Enviar Dinero</h3>
                        <p class="text-muted">Transfiere fondos de forma inmediata a otras cuentas.</p>
                    </div>

                    <div class="alert alert-success text-center fw-bold mb-4">
                        Saldo disponible: $<span id="saldoDisponible">0.00</span>
                    </div>

                    <div id="alertMsg" class="alert d-none" role="alert"></div>

                    <form id="sendMoneyForm">
                        <div class="mb-3">
                            <label for="recipient" class="form-label fw-bold">Destinatario (Nombre o Correo)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="recipient" placeholder="Ej. Juan Pérez" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="amount" class="form-label fw-bold">Monto a enviar ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Confirmar Transferencia</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/sendmoney.js"></script>
</body>
</html>
