<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Digital - Historial de Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-custom {
            background-color: #1e3c72;
        }
        .card-custom {
            border-radius: 15px;
            display: none; /* Oculto inicialmente para animación de entrada */
        }
        .badge-deposit {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .badge-send {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-wallet2 me-2"></i>Mi Wallet</span>
            <button id="btnBack" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Menú</button>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom bg-white p-4 shadow-sm">
                    
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                        <div>
                            <h3 class="fw-bold mb-1"><i class="bi bi-clock-history text-warning me-2"></i>Historial de Actividad</h3>
                            <p class="text-muted mb-0">Revisa y filtra de manera interactiva todos tus movimientos financieros.</p>
                        </div>
                        
                        <div class="btn-group shadow-sm" role="group" aria-label="Filtros">
                            <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="Todos">Todas</button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="Depósito">Depósitos</button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="Envío">Envíos</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Detalle / Concepto</th>
                                    <th class="text-end">Monto</th>
                                </tr>
                            </thead>
                            <tbody id="transactionTableBody">
                                </tbody>
                        </table>
                    </div>

                    <div id="emptyState" class="text-center py-5 d-none">
                        <i class="bi bi-folder-x display-1 text-muted"></i>
                        <p class="text-muted mt-3 mb-0">No se encontraron movimientos registrados en esta categoría.</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/transactions.js"></script>
</body>
</html>
