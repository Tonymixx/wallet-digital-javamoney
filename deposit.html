<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Digital - Realizar Depósito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-custom {
            background-color: #1e3c72;
        }
        .card-custom {
            border-radius: 15px;
            display: none; /* Oculto para animación de entrada */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-wallet2 me-2"></i>Mi Wallet</span>
            <button id="btnBack" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Menú</button>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-custom bg-white p-4 shadow-sm">
                    
                    <div class="text-center mb-4">
                        <div class="text-primary mb-2">
                            <i class="bi bi-arrow-down-circle-fill display-4"></i>
                        </div>
                        <h3 class="fw-bold">Cargar Fondos</h3>
                        <p class="text-muted">Introduce el monto que deseas depositar en tu cuenta.</p>
                    </div>

                    <div class="alert alert-secondary text-center fw-bold mb-4">
                        Saldo actual en cuenta: $<span id="saldoActual">0.00</span>
                    </div>

                    <div id="alertMsg" class="alert d-none" role="alert"></div>

                    <form id="depositForm">
                        <div class="mb-4">
                            <label for="amount" class="form-label fw-bold">Monto a depositar ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Confirmar Depósito</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/deposit.js"></script>
</body>
</html>
